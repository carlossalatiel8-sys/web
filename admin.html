<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pedidos | KAY GUITAR</title>
    <link rel="icon" type="image/png" href="assets/carlos-martinez-pick-logo-transparent.png?v=2" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="admin-page">
    <main class="admin-shell">
      <header class="admin-topbar">
        <a class="admin-brand" href="index.html"><img src="assets/carlos-martinez-pick-logo-transparent.png" alt="CM" /> KAY GUITAR</a>
        <div class="admin-header-actions"><a class="admin-back" href="index.html">← Volver a la tienda</a><button class="admin-logout" id="admin-logout" type="button">Cerrar sesión</button></div>
      </header>
      <section class="admin-hero">
        <div>
          <p class="eyebrow"><span></span> CONTROL DE PEDIDOS</p>
          <h1>ENTREGA<br /><em>RÁPIDA.</em></h1>
        </div>
        <p class="admin-status" id="admin-account-status">Comprobando acceso seguro…</p>
      </section>
      <section id="admin-content" hidden>
        <div class="admin-toolbar">
          <div class="admin-filters" aria-label="Filtrar pedidos">
            <button class="admin-filter active" data-filter="all">Todos</button>
            <button class="admin-filter" data-filter="pending_validation">Por validar</button>
            <button class="admin-filter" data-filter="payment_approved">Pagados</button>
            <button class="admin-filter" data-filter="delivered">Entregados</button>
          </div>
          <button class="button outline admin-refresh" id="admin-refresh" type="button">Actualizar</button>
        </div>
        <p class="admin-message" id="admin-message"></p>
        <div class="admin-orders" id="admin-orders"></div>
      </section>
    </main>
    <section class="receipt-modal" id="receipt-modal" hidden aria-label="Comprobante de pago">
      <div class="receipt-modal-card">
        <button class="receipt-close" id="receipt-close" type="button" aria-label="Cerrar comprobante">×</button>
        <p class="eyebrow"><span></span> COMPROBANTE DE PAGO</p>
        <h2 id="receipt-title">Pedido</h2>
        <div class="receipt-preview" id="receipt-preview"></div>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="admin.js"></script>
  </body>
</html>
